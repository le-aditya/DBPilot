# Render blueprint for DBPilot.
#
# Deploy:  push to GitHub, then New > Blueprint on render.com and pick this repo.
# Two secrets are marked sync:false and must be pasted into the dashboard on the
# first deploy: GEMINI_API_KEY, and nothing else — the rest are generated.
services:
  - type: web
    name: dbpilot-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dbpilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Fernet needs a 32-byte urlsafe-base64 key, which generateValue does not
      # produce, so this one is set by hand once:
      #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      - key: DBPILOT_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CORS_ORIGINS
        value: '["https://dbpilot-web.onrender.com"]'

  - type: web
    name: dbpilot-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://dbpilot-api.onrender.com
    routes:
      # An SPA: every path that is not a file is index.html.
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: dbpilot-db
    plan: free
    postgresMajorVersion: "16"
